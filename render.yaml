# Render deployment configuration (Blueprint).
# Provides a two-service architecture:
#   1. Backend Web Service (Node.js/Express + WebSocket on /ws)
#   2. Frontend Static Site (Vite React build)
#
# IMPORTANT SECURITY:
#   - SARVAM_API_KEY is added manually in Render > Web Service > Environment
#     using `sync: false` so the dashboard prompts for it. It is never stored
#     in this file or any tracked source.
#   - Real secrets must never be placed in this file.
#
# NOTE: Monorepo root directories use the `rootDir` field. `npm install` runs
# inside the declared rootDir so Vite is installed before `npm run build`.
services:
  # ---------- Backend: Node.js WebSocket server ----------
  - type: web
    name: voice-health-screener-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Pulse Intake
      # REQUIRED: set the real Sarvam key in the Render dashboard (prompts on creation).
      - key: SARVAM_API_KEY
        sync: false
      # Allowed browser origin(s) for CORS. Set to the deployed frontend, e.g.
      # https://voice-health-screener-client.onrender.com (comma-separated allowed).
      - key: CLIENT_URL
        sync: false
      - key: SARVAM_STT_MODEL
        value: saaras:v3
      - key: SARVAM_STT_MODE
        value: codemix
      - key: SARVAM_LLM_MODEL
        value: sarvam-105b-conversations
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: shubh
      - key: SARVAM_TTS_LANGUAGE
        value: en-IN
      - key: SARVAM_REQUEST_TIMEOUT_MS
        value: "15000"

  # ---------- Frontend: Vite static site ----------
  - type: static
    name: voice-health-screener-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point the frontend at the deployed backend so it connects to wss://.../ws.
      - key: VITE_API_URL
        fromService:
          name: voice-health-screener-server
          type: web
          envVarKey: RENDER_EXTERNAL_URL